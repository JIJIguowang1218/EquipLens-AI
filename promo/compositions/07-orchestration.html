<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>07 编排</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE}
.grid{position:absolute;inset:0;opacity:.28;background-image:linear-gradient(#17171A 1px,transparent 1px),linear-gradient(90deg,#17171A 1px,transparent 1px);background-size:96px 96px}
.k{position:absolute;left:96px;top:64px;font-size:22px;letter-spacing:.2em;color:#6E6E73}
.h{position:absolute;left:96px;top:104px;font-size:40px;font-weight:700}
.row{position:absolute;left:96px;right:96px;top:330px;height:220px;display:flex;align-items:center;justify-content:space-between}
.node{width:300px;height:132px;border:1px solid #2A2A30;background:#101013;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px}
.node .t{font-size:30px;font-weight:600}
.node .s{font-size:14px;letter-spacing:.14em;color:#6E6E73}
.node.on{border-color:#F2F1EE}
.joint{width:64px;height:64px;border:1px solid #3A3A40;transform:rotate(45deg);position:relative}
.joint.on{border-color:#F2F1EE;box-shadow:0 0 30px rgba(255,255,255,.25)}
.line{flex:1;height:1px;background:#222226;position:relative;margin:0 8px}
.dot{position:absolute;top:-2px;left:0;width:6px;height:6px;border-radius:50%;background:#F2F1EE}
.rail{position:absolute;left:96px;right:96px;bottom:220px;height:3px;background:#1B1B1E}
.rail i{position:absolute;top:-5px;width:13px;height:13px;border-radius:50%;background:#2E2E34}
.rail i.on{background:#F2F1EE}
.cap{position:absolute;left:96px;bottom:150px;font-size:22px;color:#6E6E73}
.cap b{color:#F2F1EE}
.stage{position:absolute;left:96px;top:520px;font-size:15px;letter-spacing:.14em;color:#4E4E54}
</style></head><body>
<div id="root" data-composition-id="orchestration" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="k">03　整体编排</div>
  <div class="h">workflow 骨架，加 agent 关节</div>

  <div class="row">
    <div class="node" id="n1"><div class="t">立项</div><div class="s">INTENT</div></div>
    <div class="joint" id="j1"></div>
    <div class="line"><div class="dot" id="d1"></div></div>
    <div class="node" id="n2"><div class="t">检索</div><div class="s">RETRIEVE</div></div>
    <div class="joint" id="j2"></div>
    <div class="line"><div class="dot" id="d2"></div></div>
    <div class="node" id="n3"><div class="t">分析</div><div class="s">ANALYZE</div></div>
    <div class="joint" id="j3"></div>
    <div class="line"><div class="dot" id="d3"></div></div>
    <div class="node" id="n4"><div class="t">排版</div><div class="s">LAYOUT</div></div>
    <div class="joint" id="j4"></div>
    <div class="line"><div class="dot" id="d4"></div></div>
    <div class="node" id="n5"><div class="t">交付</div><div class="s">EXPORT</div></div>
  </div>

  <div class="rail">
    <i class="on" style="left:0%"></i><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i><i style="left:calc(100% - 13px)"></i>
  </div>
  <div class="cap" id="cap">每一步都留版本与成本　·　<b>固定输入 + 固定版本 → 可复现</b></div>
  <div class="stage" id="st">STAGE 1 / 5　立项确认</div>
</div>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo(".k",{opacity:0},{opacity:1,duration:.3},.1);
tl.fromTo(".h",{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:"power3.out"},.2);
tl.fromTo(".node",{opacity:0,y:20},{opacity:1,y:0,duration:.4,stagger:.22,ease:"power3.out"},.5);
tl.fromTo(".joint",{opacity:0,scale:.6},{opacity:1,scale:1,duration:.3,stagger:.22,ease:"back.out(2)"},.8);

const stages=["立项确认","检索候选","结构化分析","一车一页","导出交付"];
for(let i=0;i<4;i++){
  const t=1.6+i*1.3;
  tl.to(`#d${i+1}`,{x:(i+1)*0+220,duration:.9,ease:"power1.inOut"},t);
  tl.to(`#j${i+1}`,{borderColor:"#F2F1EE",duration:.15},t+.4);
  tl.to(`#n${i+1}`,{borderColor:"#F2F1EE",duration:.15},t+.1);
  tl.call(()=>{
    const el=document.getElementById('st');
    el.textContent = 'STAGE ' + (i+2) + ' / 5　' + stages[i+1];
    document.querySelectorAll('.rail i').forEach((x,k)=>x.classList.toggle('on',k<=i+1));
  },[],t+.4);
}
tl.fromTo("#cap",{opacity:0},{opacity:1,duration:.4},5.4);
tl.timeScale(1.3);
window.__timelines["orchestration"] = tl; tl.seek(0);
</script></body></html>
