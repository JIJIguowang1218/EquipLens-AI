<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>09 数据管线</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE}
.grid{position:absolute;inset:0;opacity:.28;background-image:linear-gradient(#17171A 1px,transparent 1px),linear-gradient(90deg,#17171A 1px,transparent 1px);background-size:96px 96px}
.k{position:absolute;left:96px;top:64px;font-size:22px;letter-spacing:.2em;color:#6E6E73}
.h{position:absolute;left:96px;top:104px;font-size:40px;font-weight:700}
.lay{position:absolute;left:96px;right:96px;top:230px}
.l{display:flex;align-items:center;gap:26px;height:104px;border-top:1px solid #1E1E22;opacity:0}
.l .n{width:70px;font-size:15px;letter-spacing:.16em;color:#5A5A60;font-family:monospace}
.l .t{width:290px;font-size:30px;font-weight:700}
.l .d{flex:1;font-size:18px;color:#8A8A8F}
.l .bar{width:180px;height:3px;background:#1E1E22;position:relative}
.l .bar i{position:absolute;left:0;top:0;height:3px;width:0;background:#F2F1EE}
.cap{position:absolute;left:96px;bottom:100px;font-size:24px;color:#7A7A80}
.cap b{color:#F2F1EE}
</style></head><body>
<div id="root" data-composition-id="pipeline" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="k">04　数据管线</div>
  <div class="h">从原图，到可复用的资产</div>
  <div class="lay">
    <div class="l"><div class="n">01</div><div class="t">Raw</div><div class="d">原图 · 原网页 · 客户附件</div><div class="bar"><i></i></div></div>
    <div class="l"><div class="n">02</div><div class="t">Asset</div><div class="d">车型 · 视角 · 部件 · 质量分</div><div class="bar"><i></i></div></div>
    <div class="l"><div class="n">03</div><div class="t">Evidence</div><div class="d">E3 / E1 · URL · 标题 · 版本</div><div class="bar"><i></i></div></div>
    <div class="l"><div class="n">04</div><div class="t">Analysis</div><div class="d">三维度 · 部件 · CMF · 意图</div><div class="bar"><i></i></div></div>
    <div class="l"><div class="n">05</div><div class="t">Page IR</div><div class="d">槽位 · 文案 · 样式 · 来源</div><div class="bar"><i></i></div></div>
    <div class="l"><div class="n">06</div><div class="t">Run Ledger</div><div class="d">run_id · 模型 · Prompt · 成本</div><div class="bar"><i></i></div></div>
  </div>
  <div class="cap" id="cap">每一层都能回放　·　<b>asset → analysis → page → export 全链路可追</b></div>
</div>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo(".k",{opacity:0},{opacity:1,duration:.3},.1);
tl.fromTo(".h",{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:"power3.out"},.2);
tl.fromTo(".l",{opacity:0,x:-30},{opacity:1,x:0,duration:.35,stagger:.22,ease:"power3.out"},.4);
tl.fromTo(".l .bar i",{width:0},{width:"100%",duration:.5,stagger:.22,ease:"power2.out"},.6);
tl.fromTo("#cap",{opacity:0},{opacity:1,duration:.4},3.4);
tl.timeScale(1.2);
window.__timelines["pipeline"] = tl; tl.seek(0);
</script></body></html>
