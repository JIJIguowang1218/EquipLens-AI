<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>06 操作</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE}
.stage{position:absolute;inset:0;background:radial-gradient(1300px 760px at 50% 42%,#161618 0%,#0B0B0C 64%)}
.grid{position:absolute;inset:0;opacity:.45;background-image:linear-gradient(#1C1C1F 1px,transparent 1px),linear-gradient(90deg,#1C1C1F 1px,transparent 1px);background-size:96px 96px}
.win{position:absolute;left:240px;top:56px;width:1440px;height:900px;overflow:hidden;border:1px solid #2C2C31;box-shadow:0 80px 200px rgba(0,0,0,.7);background:#fff}
.win video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.label{position:absolute;left:240px;bottom:40px;font-size:24px;letter-spacing:.22em;color:#75757A}
.label b{color:#F2F1EE}
.idx{position:absolute;right:240px;bottom:26px;font-size:64px;font-weight:800;color:#2A2A2F}
</style></head><body>
<div id="root" data-composition-id="uideliver" data-start="0" data-duration="17" data-width="1920" data-height="1080">
  <div class="stage"></div><div class="grid"></div>
  <div class="win" id="w">
    <video id="v1" src="assets/rec/ui-type.mp4" muted data-start="0" data-duration="5"></video>
    <video id="v2" src="assets/rec/ui-crop.mp4" muted data-start="5" data-duration="4.2" style="opacity:0"></video>
    <video id="v3" src="assets/rec/ui-result.mp4" muted data-start="9.2" data-duration="4.3" style="opacity:0"></video>
    <video id="v4" src="assets/rec/ui-settings.mp4" muted data-start="13.5" data-duration="3.1" style="opacity:0"></video>
  </div>
  <div class="label" id="dl">01　<b>立项：输入类目与部位</b></div>
  <div class="idx" id="di">01</div>
</div>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#w",{y:620,scale:.94,opacity:0},{y:0,scale:1,opacity:1,duration:.8,ease:"back.out(1.2)"},0);
tl.to("#w",{scale:1.05,y:-16,duration:4.2,ease:"power2.inOut"},.9);
const cuts=[[5,"#v2","02　<b>逐台拖框</b>","02"],[9.2,"#v3","03　<b>翻页与导出</b>","03"],[13.5,"#v4","04　<b>设置：本地运行</b>","04"]];
cuts.forEach(([t,sel,label,num])=>{
  tl.set(sel,{opacity:1},t);
  tl.to("#w",{x:8,duration:.05,yoyo:true,repeat:3},t);
  tl.call(()=>{document.getElementById('dl').innerHTML=label;document.getElementById('di').textContent=num;},[],t);
});
tl.to("#w",{scale:1.02,duration:.5},16.4);
window.__timelines["uideliver"] = tl; tl.seek(0);
</script></body></html>
