<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>05 结构化</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE}
.grid{position:absolute;inset:0;opacity:.35;background-image:linear-gradient(#18181B 1px,transparent 1px),linear-gradient(90deg,#18181B 1px,transparent 1px);background-size:96px 96px}
.kicker{position:absolute;left:96px;top:64px;font-size:22px;letter-spacing:.2em;color:#6E6E73}
.head{position:absolute;left:96px;top:104px;font-size:44px;font-weight:700}
.shot{position:absolute;left:96px;top:190px;width:900px;height:600px;overflow:hidden;border:1px solid #222226}
.shot img{width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(.85)}
.bx{position:absolute;border:1.5px solid #F2F1EE;opacity:0;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.bx .lb{position:absolute;left:0;top:-26px;font-size:16px;letter-spacing:.06em;color:#0B0B0C;background:#F2F1EE;padding:2px 8px;white-space:nowrap}
.panel{position:absolute;left:1060px;top:190px;width:760px}
.plabel{font-size:18px;letter-spacing:.16em;color:#6E6E73;margin-bottom:26px}
.field{border-bottom:1px solid #1E1E22;padding:18px 0;opacity:0}
.field .k{font-size:16px;letter-spacing:.12em;color:#6E6E73}
.field .v{font-size:34px;font-weight:600;margin-top:6px}
.cap{position:absolute;left:96px;bottom:64px;font-size:24px;color:#6E6E73}
</style></head><body>
<div id="root" data-composition-id="structure" data-start="0" data-duration="17" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="kicker" id="s-k">04　结构化</div>
  <div class="head" id="s-h">你选的部位，逐个框出来</div>
  <div class="shot" id="s-shot"><img src="assets/gate/s-hero.jpg">
    <div class="bx" id="bx0" style="left:96px;top:241px;width:273px;height:143px"><span class="lb">进气格栅</span></div>
    <div class="bx" id="bx1" style="left:97px;top:352px;width:338px;height:107px"><span class="lb">保险杠</span></div>
    <div class="bx" id="bx2" style="left:612px;top:305px;width:144px;height:72px"><span class="lb">侧防护栏</span></div>
    <div class="bx" id="bx3" style="left:480px;top:332px;width:161px;height:119px"><span class="lb">前轮拱</span></div>
    <div class="bx" id="bx4" style="left:409px;top:366px;width:116px;height:103px"><span class="lb">登车踏步</span></div>
                          </div>
  <div class="panel">
    <div class="plabel" id="s-pl">前脸 · 倒梯形前脸</div>
    <div class="field" id="f1"><div class="k">构型 TERM</div><div class="v">倒梯形前脸</div></div>
    <div class="field" id="f2"><div class="k">族 FAMILY</div><div class="v">钣金覆盖件</div></div>
    <div class="field" id="f3"><div class="k">形态 FORM</div><div class="v">顶边平直，两侧内收</div></div>
    <div class="field" id="f4"><div class="k">CMF</div><div class="v">白色漆面 · 塑料</div></div>
  </div>
  <div class="cap" id="s-cap">每个框里只留部件本身，框不对可以拖</div>
</div>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#s-k",{opacity:0},{opacity:1,duration:.4},.2);
tl.fromTo("#s-h",{opacity:0,y:12},{opacity:1,y:0,duration:.6,ease:"power3.out"},.3);
tl.fromTo("#s-shot",{opacity:0,scale:1.06},{opacity:1,scale:1,duration:1.0,ease:"expo.out"},.6);
tl.fromTo(".bx",{opacity:0,scale:.94},{opacity:1,scale:1,duration:.45,stagger:.55,ease:"power3.out"},2.2);
tl.fromTo(".field",{opacity:0,x:20},{opacity:1,x:0,duration:.5,stagger:.6,ease:"power3.out"},5.4);
tl.fromTo("#s-cap",{opacity:0},{opacity:1,duration:.6},12.4);
window.__timelines["structure"] = tl; tl.seek(0);
</script></body></html>
