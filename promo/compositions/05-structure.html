<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>05 结构化</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE}
.grid{position:absolute;inset:0;opacity:.3;background-image:linear-gradient(#18181B 1px,transparent 1px),linear-gradient(90deg,#18181B 1px,transparent 1px);background-size:96px 96px}
.kicker{position:absolute;left:96px;top:64px;font-size:22px;letter-spacing:.2em;color:#6E6E73}
.head{position:absolute;left:96px;top:104px;font-size:40px;font-weight:700}
.shot{position:absolute;left:96px;top:186px;width:900px;height:600px;overflow:hidden;border:1px solid #222226}
.shot img{width:100%;height:100%;object-fit:cover;filter:saturate(.5) brightness(.85);transition:none}
.bx{position:absolute;border:1.5px solid #6A6A70;opacity:.55}
.bx.on{border-color:#F2F1EE;opacity:1;box-shadow:0 0 0 9999px rgba(11,11,12,.45)}
.bx .lb{position:absolute;left:0;top:-24px;font-size:15px;color:#0B0B0C;background:#8A8A8F;padding:2px 8px;white-space:nowrap}
.bx.on .lb{background:#F2F1EE}
.panel{position:absolute;left:1060px;top:186px;width:760px}
.who{font-size:16px;letter-spacing:.14em;color:#6E6E73}
.name{font-size:44px;font-weight:800;margin-top:8px}
.f{margin-top:26px;border-top:1px solid #1E1E22;padding-top:14px}
.f .k{font-size:14px;letter-spacing:.12em;color:#6E6E73}
.f .v{font-size:30px;font-weight:600;margin-top:4px;line-height:1.25}
.cap{position:absolute;left:96px;bottom:64px;font-size:22px;color:#6E6E73}
</style></head><body>
<div id="root" data-composition-id="structure" data-start="0" data-duration="13" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="kicker" id="k">04　结构化</div>
  <div class="head" id="h">每个部位，四个字段</div>
  <div class="shot" id="shot"><img id="img" src="assets/gate/s-hero.jpg">
    <div class="bx" id="bx0" style="left:96px;top:241px;width:273px;height:143px"><span class="lb">进气格栅</span></div>
    <div class="bx" id="bx1" style="left:97px;top:352px;width:338px;height:107px"><span class="lb">保险杠</span></div>
    <div class="bx" id="bx2" style="left:612px;top:305px;width:144px;height:72px"><span class="lb">侧防护栏</span></div>
    <div class="bx" id="bx3" style="left:480px;top:332px;width:161px;height:119px"><span class="lb">前轮拱</span></div>
    <div class="bx" id="bx4" style="left:409px;top:366px;width:116px;height:103px"><span class="lb">登车踏步</span></div>
  </div>
  <div class="panel">
    <div class="who" id="who">01 / 05　框选部位</div>
    <div class="name" id="pname">进气格栅</div>
    <div class="f"><div class="k">构型 TERM</div><div class="v" id="v1">—</div></div>
    <div class="f"><div class="k">族 FAMILY</div><div class="v" id="v2">—</div></div>
    <div class="f"><div class="k">形态 FORM</div><div class="v" id="v3">—</div></div>
    <div class="f"><div class="k">CMF</div><div class="v" id="v4">—</div></div>
  </div>
  <div class="cap" id="cap">框不对可以拖，每个字段都能改</div>
</div>
<script>const PARTS = [{"slot": "grille", "cn": "进气格栅", "bbox": [107, 402, 410, 640], "term": "横置多层格栅", "fam": "钣金覆盖件", "form": "横向黑色饰条七层，左右收窄。", "cmf": "塑料"}, {"slot": "bumper", "cn": "保险杠", "bbox": [108, 587, 484, 766], "term": "整体式保险杠", "fam": "钣金覆盖件", "form": "白色漆面，下沿内收，两端包住灯组下缘。", "cmf": "塑料"}, {"slot": "side_guard", "cn": "侧防护栏", "bbox": [680, 509, 840, 629], "term": "管式侧防护栏", "fam": "型材框架件", "form": "银色圆管沿底盘侧缘水平布置。", "cmf": "金属"}, {"slot": "wheel_arch", "cn": "前轮拱", "bbox": [533, 553, 712, 751], "term": "一体式同色轮拱", "fam": "钣金覆盖件", "form": "连续圆弧拱缘，与白漆面平顺过渡。", "cmf": "塑料"}, {"slot": "step", "cn": "登车踏步", "bbox": [454, 610, 583, 782], "term": "两级固定踏板", "fam": "铸锻机加件", "form": "两级黑色踏板，层间可见。", "cmf": "金属"}];</script>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#k",{opacity:0},{opacity:1,duration:.3},.1);
tl.fromTo("#h",{opacity:0,y:12},{opacity:1,y:0,duration:.45,ease:"power3.out"},.2);
tl.fromTo("#shot",{opacity:0,scale:1.04},{opacity:1,scale:1,duration:.6,ease:"expo.out"},.3);
tl.fromTo(".bx",{opacity:0},{opacity:.55,duration:.3,stagger:.06},.5);

// 第一拍：五个部位快闪一圈（0.8-3.0）
PARTS.forEach((p,i)=>{
  tl.call(()=>{
    document.querySelectorAll('.bx').forEach((b,j)=>b.classList.toggle('on', j===i));
    const n=document.getElementById('pname'); n.textContent=p.cn;
    gsap.fromTo(n,{opacity:.2,y:6},{opacity:1,y:0,duration:.18});
    document.getElementById('who').textContent = String(i+1).padStart(2,'0')+' / 05　快速过一遍';
  },[],0.8+i*0.42);
});
tl.call(()=>{document.querySelectorAll('.bx').forEach(b=>b.classList.add('on'));},[],3.1);
tl.to(".bx",{opacity:1,duration:.2},3.1);

// 第二拍：四个小标题推进（3.3-5.0）
const heads=['TERM 构型','FAMILY 族','FORM 形态','CMF'];
tl.call(()=>{document.getElementById('who').textContent='四个字段';},[],3.3);
tl.fromTo(".f .k",{opacity:0,x:40,color:'#F2F1EE'},{opacity:1,x:0,duration:.35,stagger:.28,ease:"power3.out"},3.4);
tl.fromTo(".f .k",{fontSize:22},{fontSize:14,duration:.4,stagger:.28},4.2);

// 第三拍：逐部位填字段（5.2 起，每 1.45s）
PARTS.forEach((p,i)=>{
  const t=5.2+i*1.45;
  tl.call(()=>{
    document.querySelectorAll('.bx').forEach((b,j)=>b.classList.toggle('on', j===i));
    document.getElementById('pname').textContent=p.cn;
    document.getElementById('who').textContent=String(i+1).padStart(2,'0')+' / 05　框选部位';
    const set=(id,v)=>{const el=document.getElementById(id);el.textContent=v;gsap.fromTo(el,{opacity:0,y:6},{opacity:1,y:0,duration:.22});};
    set('v1',p.term); set('v2',p.fam); set('v3',p.form); set('v4',p.cmf);
  },[],t);
});
tl.fromTo("#cap",{opacity:0},{opacity:1,duration:.4},12.2);
tl.timeScale(1.15);
window.__timelines["structure"] = tl; tl.seek(0);
</script></body></html>
