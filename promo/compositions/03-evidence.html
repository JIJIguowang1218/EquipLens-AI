<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>03 证据链</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE}
.grid{position:absolute;inset:0;opacity:.28;background-image:linear-gradient(#17171A 1px,transparent 1px),linear-gradient(90deg,#17171A 1px,transparent 1px);background-size:96px 96px}
.k{position:absolute;left:96px;top:64px;font-size:22px;letter-spacing:.2em;color:#6E6E73}
.h{position:absolute;left:96px;top:104px;font-size:40px;font-weight:700}
.gate{position:absolute;top:250px;width:4px;height:420px;background:#26262B}
.gate.on{background:#F2F1EE;box-shadow:0 0 40px rgba(255,255,255,.25)}
.glab{position:absolute;top:200px;font-size:16px;letter-spacing:.18em;color:#6E6E73;transform:translateX(-50%)}
.frag{position:absolute;left:150px;width:640px;height:56px;padding:0 18px;display:flex;align-items:center;
  border-left:2px solid #3A3A40;font-size:19px;color:#B9B9BE;background:#0F0F12}
.rej{position:absolute;right:150px;width:520px;padding:16px 20px;border:1px solid #26262B;font-size:16px;color:#6E6E73}
.cap{position:absolute;left:96px;bottom:96px;font-size:30px;color:#8A8A8F}
.cap b{color:#F2F1EE}
.count{position:absolute;right:96px;top:104px;font-size:16px;letter-spacing:.16em;color:#6E6E73}
</style></head><body>
<div id="root" data-composition-id="evidence" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="k">02　检索与证据链</div>
  <div class="h">每一段文字，都要先证明自己值得留下</div>
  <div class="count" id="c">PASS 0 / 6</div>

  <div class="gate" id="g1" style="left:900px"></div><div class="glab" id="l1" style="left:900px">Gate 01 来源</div>
  <div class="gate" id="g2" style="left:1250px"></div><div class="glab" id="l2" style="left:1250px">Gate 02 实体</div>
  <div class="gate" id="g3" style="left:1600px"></div><div class="glab" id="l3" style="left:1600px">Gate 03 时效</div>

  <div class="frag" id="f1" style="top:270px">陕汽重卡 德龙X3000 375马力 6X6 沙漠越野底盘</div>
  <div class="frag" id="f2" style="top:350px">穿越沙漠的卡车 · 智能分身实时回复</div>
  <div class="frag" id="f3" style="top:430px">沙漠牵引车交付阿联酋，法士特变速箱成亮点</div>
  <div class="frag" id="f4" style="top:510px">2德龙.#二手自卸车 #自卸工程车 #土方</div>
  <div class="frag" id="f5" style="top:590px">一汽解放 JH6 牵引车 前脸实拍</div>

  <div class="rej" id="r1" style="top:270px">✕ 无具体实体 · 不计入</div>
  <div class="rej" id="r2" style="top:510px">✕ 广告标签 · 证据等级 E1</div>

  <div class="cap" id="cap">留下的进清单，落选的进回收站　·　<b>E3 才配当依据</b></div>
</div>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo(".k",{opacity:0},{opacity:1,duration:.3},.1);
tl.fromTo(".h",{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:"power3.out"},.2);
tl.fromTo(".gate",{scaleY:0},{scaleY:1,duration:.4,stagger:.15,ease:"power3.out"},.4);
tl.fromTo(".glab",{opacity:0},{opacity:1,duration:.3,stagger:.15},.6);
tl.fromTo(".frag",{opacity:0,x:-40},{opacity:1,x:0,duration:.35,stagger:.18,ease:"power2.out"},.9);
tl.to("#g1",{backgroundColor:"#F2F1EE",duration:.2},2.0);
tl.to("#g2",{backgroundColor:"#F2F1EE",duration:.2},2.9);
tl.to("#g3",{backgroundColor:"#F2F1EE",duration:.2},3.8);
tl.fromTo("#r1",{opacity:0,scale:.9},{opacity:1,scale:1,duration:.3},3.2);
tl.fromTo("#r2",{opacity:0,scale:.9},{opacity:1,scale:1,duration:.3},4.2);
tl.to("#f2",{opacity:.25,x:-60,duration:.4},3.1);
tl.to("#f4",{opacity:.25,x:-60,duration:.4},4.1);
tl.fromTo(".cap",{opacity:0},{opacity:1,duration:.5},5.6);
tl.fromTo("#c",{opacity:0},{opacity:1,duration:.3},1.0);
tl.to({v:0},{v:3,duration:3.6,ease:"none",onUpdate:function(){
  document.getElementById('c').textContent = 'PASS ' + Math.round(this.targets()[0].v) + ' / 6';
}},1.0);
tl.timeScale(1.25);
window.__timelines["evidence"] = tl; tl.seek(0);
</script></body></html>
