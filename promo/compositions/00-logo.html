<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>00 片头</title>
<style>
@font-face{font-family:"NotoSC";src:url("assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
#root{position:absolute;inset:0;font-family:"NotoSC",sans-serif;color:#F2F1EE;display:flex;align-items:center;justify-content:center}
.grid{position:absolute;inset:0;opacity:.25;background-image:linear-gradient(#17171A 1px,transparent 1px),linear-gradient(90deg,#17171A 1px,transparent 1px);background-size:96px 96px}
.lockup{position:relative;display:flex;align-items:center;gap:48px;transform:translateX(160px)}
.mark{width:360px;height:360px;flex:none}
.word{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.name{font-size:132px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.claim{font-size:38px;color:#8A8A8F;white-space:nowrap}
.mask{position:absolute;left:0;right:0;bottom:0;top:0;background:#0B0B0C;transform-origin:right center}
</style></head><body>
<div id="root" data-composition-id="logo" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="lockup" id="lk">
    <svg class="mark" id="mark" viewBox="0 0 48 48" fill="none" stroke="#F2F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle id="ring" cx="21" cy="21" r="12.6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <g id="teeth">
        <path d="M21 4.4v4.2"/><path d="M35.6 12.4l-3.7 2.1"/><path d="M35.6 29.6l-3.7-2.1"/>
        <path d="M21 37.6v-4.2"/><path d="M6.4 29.6l3.7-2.1"/><path d="M6.4 12.4l3.7 2.1"/>
      </g>
      <path id="handle" d="M30.3 30.3 41 41" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" stroke-width="3.1"/>
    </svg>
    <div class="word" id="word">
      <div class="name" id="name">EquipLens</div>
      <div class="claim" id="claim">工程机械竞品设计分析</div>
    </div>
  </div>
</div>
<script src="assets/vendor/gsap.min.js"></script><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
gsap.set("#teeth path",{opacity:0,transformOrigin:"21px 21px"});
gsap.set("#name,#claim",{opacity:0});

// 环从 12 点生长
tl.fromTo("#ring",{strokeDashoffset:100},{strokeDashoffset:0,duration:1.1,ease:"power2.inOut"},0.2);
// 齿逐个长出
tl.to("#teeth path",{opacity:1,duration:.12,stagger:.07,ease:"none"},1.15);
tl.fromTo("#teeth path",{scale:.2},{scale:1,duration:.28,stagger:.07,ease:"back.out(3)"},1.15);
// 手柄画出
tl.fromTo("#handle",{strokeDashoffset:100},{strokeDashoffset:0,duration:.45,ease:"power2.out"},1.7);
// 整体落定
tl.fromTo("#mark",{scale:.96},{scale:1,duration:.5,ease:"back.out(2)"},2.1);
tl.to("#mark",{scale:1.04,duration:.18,yoyo:true,repeat:1,ease:"power2.out"},2.5);

// 左移 + 名称擦出
tl.to("#lk",{x:-330,duration:.9,ease:"power3.inOut"},3.0);
tl.to("#mark",{width:210,height:210,duration:.9,ease:"power3.inOut"},3.0);
tl.fromTo("#name",{opacity:0,x:40},{opacity:1,x:0,duration:.6,ease:"power3.out"},3.35);
// 一行说明
tl.fromTo("#claim",{opacity:0,y:12},{opacity:1,y:0,duration:.6,ease:"power3.out"},4.1);
tl.to("#lk",{x:-300,duration:1.4,ease:"power1.out"},4.4);

window.__timelines["logo"] = tl; tl.seek(0);
</script></body></html>
