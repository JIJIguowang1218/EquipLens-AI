<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EquipLens · 竞品设计分析</title>
<style>
:root{
  --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08);
  --bg:#ffffff; --bg2:#f5f5f7; --accent:#0071e3;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",
       "Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* ---------- nav ---------- */
nav{
  position:sticky; top:0; z-index:50; height:52px;
  display:flex; align-items:center; gap:14px; padding:0 28px;
  background:rgba(255,255,255,.72); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.logo{width:26px;height:26px;color:var(--ink);flex:none}
.brand{font-size:15px;font-weight:600;letter-spacing:.02em}
.brand span{color:var(--muted);font-weight:400;margin-left:8px;font-size:13px}
.navdots{margin-left:auto;display:flex;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#d2d2d7;transition:.4s var(--ease)}
.dot.on{background:var(--ink);width:22px;border-radius:4px}
/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;border-right:1px solid var(--line);background:#fbfbfd;
  padding:18px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh}
.brandrow{display:flex;align-items:center;gap:10px;padding:4px 8px 10px;font-weight:600;font-size:15px}
.brandrow .logo{width:24px;height:24px}
.newbtn{height:40px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-size:14px;
  font-weight:600;cursor:pointer;transition:.2s var(--ease)}
.newbtn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.14)}
.sidelabel{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:14px 8px 4px}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.hitem2{padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .15s}
.hitem2:hover{background:#f0f0f3}
.hitem2.on{background:#e9e9ee}
.hitem2 b{display:block;font-size:13.5px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem2 span{font-size:11.5px;color:var(--muted)}
.hitem2{position:relative}
.hdel{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;
  color:#c7c7cc;font-size:15px;opacity:0;transition:.15s;cursor:pointer}
.hitem2:hover .hdel{opacity:1}
.hdel:hover{color:#ff3b30}
.hgroup{font-size:11px;color:#a1a1a6;padding:10px 10px 4px}
.hren{position:absolute;right:26px;top:50%;transform:translateY(-50%);font-style:normal;
  color:#c7c7cc;font-size:12px;opacity:0;transition:.15s;cursor:pointer}
.hitem2:hover .hren{opacity:1}
.hren:hover{color:var(--ink)}
.setlist{border-top:1px solid var(--line)}
.setrow{display:flex;justify-content:space-between;gap:20px;padding:16px 2px;
  border-bottom:1px solid var(--line);font-size:14px}
.setrow span{color:var(--muted)}
.setrow b{font-weight:500;text-align:right;word-break:break-all}
.hempty{font-size:12.5px;color:#a1a1a6;padding:8px}
.sidefoot{font-size:11px;color:#a1a1a6;padding:8px}
.sidefoot a{cursor:pointer;color:var(--muted)}
.sidefoot a:hover{color:var(--ink)}
.hsearch{height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;
  padding:0 10px;font-size:12.5px;outline:none;font-family:inherit}
.hsearch:focus{border-color:#c7c7cc}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:14px;padding:0 28px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.8);
  backdrop-filter:blur(18px);z-index:20}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:500}
.dots{margin-left:auto;display:flex;gap:6px}
main{max-width:1080px;margin:0 auto;padding:38px 32px 120px;width:100%}
.step{animation:rise .5s var(--ease) both}
body.no-anim .step{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{font-size:clamp(34px,4.4vw,56px);line-height:1.06;letter-spacing:-.015em;font-weight:700}
h1 em{font-style:normal;color:var(--muted)}
.sub{margin-top:16px;font-size:19px;color:var(--muted);max-width:640px;line-height:1.5}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;
  margin-bottom:14px}
/* ---------- cards ---------- */
.card{
  background:var(--bg2); border-radius:22px; padding:26px 26px 22px;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease);
}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 50px rgba(0,0,0,.07)}
.label{font-size:13px;color:var(--muted);margin-bottom:10px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:14px;cursor:pointer;transition:.25s var(--ease);user-select:none;
}
.chip:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.custom{background:#fff;color:var(--ink);border:1px dashed var(--ink)}
.chip small{opacity:.55;margin-left:6px;font-size:12px}
.field{
  width:100%;height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);
  background:#fff;font-size:16px;color:var(--ink);outline:none;transition:.25s var(--ease);
  font-family:inherit;
}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(0,0,0,.05)}
.field::placeholder{color:#a1a1a6}
.inputrow{display:flex;gap:10px}
.btn.small{height:52px;padding:0 22px;font-size:14px;border-radius:14px;white-space:nowrap;flex:none}
.hint2{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:18px}
.picked-line{margin-top:12px;font-size:14px;color:var(--ink);min-height:22px;line-height:1.7}
.picked-line a{color:var(--ink);cursor:pointer;text-decoration:none;
  border-bottom:1px solid rgba(0,0,0,.18);padding-bottom:1px;margin-right:2px}
.picked-line a:hover{border-color:var(--ink);color:var(--muted)}
.field.flash{background:#f5f5f7;border-color:rgba(0,0,0,.16)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px}
.stepper{display:flex;align-items:center;gap:0;background:#fff;border:1px solid var(--line);
  border-radius:999px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:#fff;font-size:20px;cursor:pointer;
  color:var(--ink);transition:.2s}
.stepper button:hover{background:#f0f0f2}
.stepper b{min-width:64px;text-align:center;font-size:17px;font-weight:600}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 26px;border-radius:999px;border:0;cursor:pointer;
  background:var(--accent);color:#fff;font-size:15px;font-weight:600;
  transition:.3s var(--ease);letter-spacing:.01em;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,113,227,.28)}
.btn:disabled{background:#d2d2d7;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:0 10px 24px rgba(0,0,0,.08)}
.actions{display:flex;gap:12px;margin-top:34px;align-items:center}
.hint{font-size:13px;color:var(--muted)}
/* ---------- step2 list ---------- */
.phead2{display:flex;align-items:baseline;gap:14px;margin-bottom:26px}
.phead2 h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.clist{border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:28px 200px 88px 1fr 44px;gap:14px;align-items:center;
  padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.crow:hover{background:#fafafa}
.crow .pick i{display:block;width:18px;height:18px;border-radius:50%;border:1.5px solid #c7c7cc;
  transition:.2s var(--ease)}
.crow.on .pick i{background:var(--ink);border-color:var(--ink)}
.crow .who{font-size:15px}
.crow .who b{font-weight:600}
.crow .rel{font-size:12px;color:var(--muted)}
.crow .why{font-size:13px;color:#3a3a3c;line-height:1.45}
.crow .why .ev{display:block;color:#a1a1a6;font-size:11.5px;margin-top:2px}
.crow .cnt{font-size:12px;color:#a1a1a6;text-align:right}
.skel{display:flex;flex-direction:column;gap:14px;padding:20px 0}
.srow{display:flex;gap:14px;align-items:center}
.srow i{width:18px;height:18px;border-radius:50%;background:#eee}
.srow span{height:14px;flex:1;background:linear-gradient(90deg,#f2f2f2,#e8e8e8,#f2f2f2);
  background-size:200% 100%;animation:shine 1.4s infinite;border-radius:6px}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.err{padding:16px 0;color:#b3261e;font-size:14px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;margin-left:8px}

/* ---------- vehicles ---------- */
.harvest{padding:10px 0 30px}
.spinner{display:flex;gap:6px;margin-bottom:18px}
.spinner i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.25;
  animation:bob 1.1s infinite}
.spinner i:nth-child(2){animation-delay:.15s}.spinner i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.hstage{font-size:15px;color:var(--ink);margin-bottom:12px}
.hbar{height:3px;background:#efeff1;border-radius:2px;overflow:hidden;margin-bottom:22px}
.hbar span{display:block;height:100%;background:var(--ink);transition:width .6s var(--ease)}
.hlist{display:flex;flex-direction:column;gap:8px}
.hitem{display:flex;gap:14px;align-items:baseline;font-size:13.5px;color:#3a3a3c;
  padding:8px 0;border-bottom:1px solid var(--line)}
.hitem b{font-weight:600;min-width:190px}
.hitem span{color:var(--muted);font-size:12px;min-width:70px}
.hitem em{color:var(--muted);font-style:normal;margin-left:auto;font-size:12px}
.vcard.out{opacity:.38}
.vcard .x{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;
  border:0;background:#fff;color:#8e8e93;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vcard .x:hover{color:#ff3b30}
.vcard .thumb{border-radius:12px;object-fit:cover;background:#eee}
.vcard .thumb.broken{background:#f2f2f4;color:#a1a1a6;font-size:12px;height:150px}
.vcard .thumb.empty{display:flex;align-items:center;justify-content:center;color:#a1a1a6;font-size:12px}
.vcard .evi{font-size:11.5px;color:#a1a1a6;margin-top:8px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:28px}
.vcard{
  background:#fff;border:1px solid var(--line);border-radius:0;padding:16px;
  cursor:pointer;transition:.35s var(--ease);position:relative;overflow:hidden;
}
.vcard:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.08)}
.vcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.vcard .t{font-weight:600;font-size:16px}
.vcard .m{color:var(--muted);font-size:13px;margin-top:3px}
.vcard .n{position:absolute;right:14px;top:14px;font-size:12px;color:var(--muted)}
.vcard .thumb{width:100%;height:150px;object-fit:contain;border-radius:0;background:#f5f5f7;margin-top:12px}
/* ---------- progress ---------- */
.plist{margin-top:26px;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.pdot{width:9px;height:9px;border-radius:50%;background:#d2d2d7;flex:none;transition:.3s}
.pdot.run{background:var(--accent);animation:pulse 1.2s infinite}
.pdot.ok{background:#34c759}
.pdot.fail{background:#ff3b30}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.45}}
.pname{font-weight:500}
.pmsg{color:var(--muted);font-size:13px;margin-left:auto}
/* ---------- results ---------- */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.frame{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  aspect-ratio:16/9;width:100%;max-width:1124px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.frame iframe{width:1600px;height:900px;border:0;transform:scale(.7025);transform-origin:top left}
@media(max-width:900px){.gallery{grid-template-columns:1fr}.frame iframe{transform:scale(.52)}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brandrow">
      <svg class="logo" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="21" cy="21" r="12.6"/>
        <path d="M21 4.4v4.2M35.6 12.4l-3.7 2.1M35.6 29.6l-3.7-2.1M21 37.6v-4.2M6.4 29.6l3.7-2.1M6.4 12.4l3.7 2.1"/>
        <path d="M30.3 30.3 41 41" stroke-width="3.3"/>
      </svg>
      <span>EquipLens</span>
    </div>
    <button class="newbtn" id="newbtn">＋ 新建分析</button>
    <input id="hsearch" class="hsearch" placeholder="搜索历史">
    <div class="sidelabel">历史</div>
    <div class="hist" id="hist"><div class="hempty">加载中…</div></div>
    <div class="sidefoot"><a id="tosettings">设置</a> · 本地运行</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div id="app"></div>
  </main>
</div>

<script>
const PARTS = [
  ["front_face","前脸整体"],["grille","进气格栅"],["bumper","保险杠"],
  ["side_guard","侧防护栏"],["wheel_arch","前轮轮拱"],["step","登车踏步"]
];
const state = {step:1, category:null, parts:[], count:3, catalog:null,
         selected:[], selMeta:[], cand:null, candJob:null,
         harvest:null, harvestJob:null, excluded:new Set(), runId:null, job:null,
         view:'new', detail:null, detailRunId:null, detailIdx:0};
const app = document.getElementById('app');
const dots = document.getElementById('dots');
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function paintDots(hide){
  dots.innerHTML = hide ? '' : [1,2,3,4,5].map(i=>`<i class="dot ${i===state.step?'on':''}"></i>`).join('');
}

let HIST = [];
async function loadHistory(){
  try{
    const r = await fetch('/api/history');
    HIST = (await r.json()).items;
    drawHistory();
  }catch(err){
    document.getElementById('hist').innerHTML = '<div class="hempty">历史加载失败</div>';
  }
}

function drawHistory(){
  const el = document.getElementById('hist');
  const q = (document.getElementById('hsearch').value || '').trim();
  const items = q ? HIST.filter(it => (it.title||it.category||'').includes(q)) : HIST;
  if(!HIST.length){
    el.innerHTML = `<div class="hempty">还没有分析记录<br><br>
      输入一个类目，比如「沙漠牵引车」，<br>三分钟后这里会出现第一条。</div>`;
    return;
  }
  if(!items.length){ el.innerHTML = '<div class="hempty">没有匹配的记录</div>'; return; }
  let cur = '';
  el.innerHTML = items.map(it=>{
    const g = (it.created_at||'').slice(0,10) === new Date().toISOString().slice(0,10) ? '今天' : '更早';
    const head = g!==cur ? (cur=g, `<div class="hgroup">${g}</div>`) : '';
    const name = it.title || it.category || '未命名';
    return head + `<div class="hitem2 ${it.id===state.detailRunId?'on':''}" data-run="${esc(it.id)}">
      <b>${esc(name)}</b>
      <span>${esc((it.created_at||'').slice(5))} · ${it.pages} 页</span>
      <i class="hdel" data-del="${esc(it.id)}" title="删除">×</i>
      <i class="hren" data-ren="${esc(it.id)}" title="重命名">✎</i></div>`;
  }).join('');
}

function bindHistory(){
  const el = document.getElementById('hist');
  el.onclick = async e=>{
    const del = e.target.closest('[data-del]');
    if(del){
      e.stopPropagation();
      if(!confirm('删除这条记录？')) return;
      await fetch('/api/run/'+del.dataset.del,{method:'DELETE'});
      if(state.detailRunId===del.dataset.del){ state.view='new'; state.step=1; render(); }
      loadHistory(); return;
    }
    const ren = e.target.closest('[data-ren]');
    if(ren){
      e.stopPropagation();
      const id = ren.dataset.ren;
      const it = HIST.find(x=>x.id===id);
      const name = prompt('重命名', it?.title || it?.category || '');
      if(name!=null){
        await fetch('/api/run/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},
          body: JSON.stringify({title:name})});
        loadHistory();
      }
      return;
    }
    const x = e.target.closest('[data-run]'); if(!x) return;
    openRun(x.dataset.run);
  };
  const hs = document.getElementById('hsearch');
  if(hs) hs.oninput = drawHistory;
}

async function openRun(id){
  const r = await fetch('/api/run/'+id);
  if(!r.ok){ return; }
  state.detail = await r.json();
  state.detailRunId = id; state.detailIdx = 0; state.view = 'detail';
  render(); loadHistory(); bindHistory();
}

function renderDetail(){
  const d = state.detail || {};
  const pages = (d.pages||[]).filter(p=>p.built && p.file);
  const meta = d.meta || {};
  paintDots(true);
  document.getElementById('crumbs').innerHTML =
    `<b>${esc(meta.category||'分析结果')}</b>　${esc(meta.created_at||'')}` +
    (meta.parts && meta.parts.length? `　·　${meta.parts.length} 个部位` : '');
  if(!pages.length){
    app.innerHTML = `<section class="step"><div class="phead2"><h2>这次分析还没有生成页面</h2></div>
      <p class="hint">回到「新建分析」重新跑一遍，或在历史里选择其它记录。</p></section>`;
    return;
  }
  const i = Math.min(state.detailIdx||0, pages.length-1);
  app.innerHTML = `<section class="step">
    <div class="phead2"><h2>结果</h2>
      <span class="hint">${i+1} / ${pages.length} · 页内右下角可「编辑布局」</span></div>
    <div class="frame"><iframe src="/files/${state.detailRunId}/${pages[i].file}" scrolling="no"></iframe></div>
    <div class="actions">
      <button class="btn ghost" id="prev" ${i<=0?'disabled':''}>上一页</button>
      <button class="btn ghost" id="nextp" ${i>=pages.length-1?'disabled':''}>下一页</button>
      ${d.pptx? `<a class="btn" href="${d.pptx}" download style="margin-left:auto">下载 PPTX</a>` : ''}
    </div>
  </section>`;
  document.getElementById('prev').onclick = ()=>{ state.detailIdx=Math.max(0,i-1); render(); };
  document.getElementById('nextp').onclick = ()=>{ state.detailIdx=Math.min(pages.length-1,i+1); render(); };
}

document.getElementById('newbtn').onclick = ()=>{
  state.view='new'; state.step=1; state.detail=null; state.detailRunId=null;
  state.harvest=null; state.job=null; state.built=null; state.cropIdx=undefined;
  document.getElementById('crumbs').innerHTML = '<b>新建分析</b>';
  render(); loadHistory(); bindHistory();
};

document.getElementById('tosettings').onclick = openSettings;

async function openSettings(){
  state.view = 'settings'; render();
}

function renderSettings(){
  paintDots(true);
  document.getElementById('crumbs').innerHTML = '<b>设置</b>';
  app.innerHTML = `<section class="step">
    <div class="phead2"><h2>设置</h2><span class="hint">本地运行，数据不出机器</span></div>
    <div class="setlist" id="setlist">加载中…</div>
  </section>`;
  fetch('/api/settings').then(r=>r.json()).then(d=>{
    document.getElementById('setlist').innerHTML = [
      ['模型', d.model || '—'],
      ['接口', d.base_url || '—'],
      ['密钥', d.key],
      ['历史记录', d.runs + ' 条'],
      ['占用空间', d.disk_mb + ' MB'],
      ['数据目录', d.runs_dir],
    ].map(([k,v])=>`<div class="setrow"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  });
}

async function boot(){
  const r = await fetch('/api/catalog'); state.catalog = await r.json();
  const saved = localStorage.getItem('el_run');
  if(saved){
    try{
      const rr = await fetch('/api/run/'+saved);
      if(rr.ok){
        const job = await rr.json();
        if(job.status === 'running'){
          state.runId = saved; state.job = job; state.step = 4;
          render(); loadHistory(); bindHistory(); poll(); return;
        }
      }
    }catch(e){}
  }
  render(); loadHistory(); bindHistory();
}

function matchVehicles(){
  const exact = state.catalog.vehicles.filter(v=>v.category===state.category);
  return exact.length ? exact
    : state.catalog.vehicles.filter(v=>(v.category||'').includes(state.category||''));
}

let lastStep = 0;
function fitFrames(){
  document.querySelectorAll('.frame').forEach(f=>{
    const w = f.clientWidth;
    if(!w) return;
    const sc = w/1600;
    const ifr = f.querySelector('iframe');
    if(ifr && !ifr.dataset.noscale){ ifr.style.transform = `scale(${sc})`; }
    if(f.dataset.fit !== 'off') f.style.height = (900*sc)+'px';
  });
}
window.addEventListener('resize', ()=>setTimeout(fitFrames, 60));

function render(){
  if(state.view === 'detail'){ renderDetail(); setTimeout(fitFrames, 30); return; }
  if(state.view === 'settings'){ renderSettings(); return; }
  paintDots();
  document.body.classList.toggle('no-anim', state.step === lastStep);
  lastStep = state.step;
  const names = {1:'立项',2:'检索',3:'素材确认',4:'分析 / 裁框',5:'排版与导出'};
  const crumb = document.getElementById('crumbs');
  if(crumb) crumb.innerHTML = `<b>新建分析</b>　·　${names[state.step]||''}`;
  if(state.step===1) step1();
  else if(state.step===2) step2();
  else if(state.step===3) step3();
  else if(state.step===4) step4();
  else step5();
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(fitFrames, 30);
}

/* ---------------- 1 立项 ---------------- */
function step1(){
  const cats = state.catalog.categories;
  const match = cats.filter(c=>c.category.includes(state.category||''))
                    .slice(0,6);
  app.innerHTML = `<section class="step">
    <h1>竞品分析，<em>十分钟</em>。</h1>
    <p class="sub">输入设备类别与分析部位，剩下的交给系统。</p>

    <div class="row" style="margin-top:44px;display:block">
      <div class="card">
        <div class="label">设备类别</div>
        <input id="cat" class="field" autocomplete="off"
               placeholder="如：矿用自卸车 / 随车吊 / 翻斗铲车"
               value="${esc(state.category||'')}">

        <div class="hint2" id="cathint">
          ${state.category ? (match.length? `匹配 ${match.reduce((a,b)=>a+b.n,0)} 台`
                                          : '库里暂无该类目，可先按通用层继续') : '输入后自动匹配库内车型'}
        </div>

        <div class="label" style="margin-top:26px">分析部位</div>
        <input id="part" class="field" autocomplete="off"
               placeholder="如：前脸、保险杠、踏步，回车确认">
        <div class="picked-line" id="picked"></div>
        <div class="hint2" id="parthint"></div>

        <div class="label" style="margin-top:26px">车型数量（将多推荐 3 台备选）</div>
        <div style="display:flex;align-items:center;gap:16px">
          <div class="stepper">
            <button id="minus">−</button><b id="cnt">${state.count}</b><button id="plus">+</button>
          </div>
          <span class="hint">每台车一页，建议 3–10 台</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="next" ${state.category&&state.parts.length?'':'disabled'}>
        下一步 · 生成候选清单</button>
    </div>
  </section>`;

  const cat = document.getElementById('cat');
  cat.oninput = ()=>{ state.category = cat.value.trim(); refresh(); };

  const part = document.getElementById('part');
  part.onkeydown = e=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const n = addPart(part.value);
    part.value = '';
    if(n){ part.classList.add('flash'); setTimeout(()=>part.classList.remove('flash'), 260); }
  };

  function refresh(){
    const hit = state.category ? matchVehicles().length : 0;
    document.getElementById('cathint').textContent =
      state.category ? (hit? `库内已有 ${hit} 台相关素材，其余靠实时检索补齐`
                            : '库里暂无该类目，将全部走实时检索')
                     : '输入后自动匹配库内车型';
    document.getElementById('next').disabled = !(state.category && state.parts.length);
  }

  document.getElementById('picked').onclick = e=>{
    const el = e.target.closest('[data-rm]'); if(!el) return;
    state.parts = state.parts.filter(x=>x!==el.dataset.rm);
    paintPicked(); document.getElementById('next').disabled = !(state.category && state.parts.length);
  };
  paintPicked();
  refresh();

  document.getElementById('minus').onclick = ()=>{ state.count=Math.max(1,state.count-1); render(); };
  document.getElementById('plus').onclick = ()=>{ state.count=Math.min(20,state.count+1); render(); };
  document.getElementById('next').onclick = ()=>{ state.step=2; startHarvest(); };
}

const PART_ALIAS = {
  '前脸':'front_face','前脸整体':'front_face','脸部':'front_face',
  '格栅':'grille','进气格栅':'grille','中网':'grille',
  '保险杠':'bumper','前杠':'bumper','包围':'bumper',
  '防护栏':'side_guard','侧防护栏':'side_guard','侧防护':'side_guard',
  '轮拱':'wheel_arch','轮眉':'wheel_arch','前轮轮拱':'wheel_arch','翼子板':'wheel_arch',
  '踏步':'step','登车踏步':'step','踏板':'step','脚蹬':'step'
};
function partName(k){ return (PARTS.find(p=>p[0]===k)||[null,k])[1]; }
function isKnown(k){ return PARTS.some(p=>p[0]===k); }
function addPart(raw){
  const toks = String(raw).split(/[、,，\s\/]+/).filter(Boolean);
  let added = 0;
  toks.forEach(t=>{
    const exact = PARTS.find(p=>p[1]===t);
    const id = exact ? exact[0] : t;          // 只做精确匹配，其余原样保留
    if(!state.parts.includes(id)){ state.parts.push(id); added++; }
  });
  paintPicked();
  return added;
}

function paintPicked(){
  const el = document.getElementById('picked');
  if(!el) return;
  el.innerHTML = state.parts.length
    ? `已选　${state.parts.map(k=>`<a data-rm="${esc(k)}">${esc(partName(k))}</a>`).join('、')}`
    : '<span style="color:#a1a1a6">尚未选择部位</span>';
  const nx = document.getElementById('next');
  if(nx) nx.disabled = !(state.category && state.parts.length);
}

/* ---------------- 2 检索（候选 + 现场爬图） ---------------- */
async function startHarvest(){
  state.harvest = {status:'running', stage:'准备中', candidates:[], progress:0, articles:0};
  render();
  const r = await fetch('/api/harvest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({category: state.category, parts: state.parts, count: state.count})});
  state.harvestJob = (await r.json()).job_id;
  pollHarvest();
}

async function pollHarvest(){
  const r = await fetch('/api/harvest/'+state.harvestJob);
  state.harvest = await r.json();
  if(state.harvest.status==='done'){ state.step = 3; initSelection(); render(); return; }
  if(state.harvest.status==='fail'){ render(); return; }
  if(state.step===2) render();
  setTimeout(pollHarvest, 1200);
}

function step2(){
  const h = state.harvest || {stage:'准备中', progress:0, candidates:[]};
  const n = h.candidates.length;
  app.innerHTML = `<section class="step">
    <div class="phead2"><h2>正在检索</h2>
      <span class="hint">${h.articles? `已读 ${h.articles} 篇文章` : '打开浏览器抓取搜索结果'}</span></div>
    <div class="harvest">
      <div class="spinner"><i></i><i></i><i></i></div>
      <div class="hstage">${esc(h.stage||'')}</div>
      <div class="hbar"><span style="width:${Math.min(100, n? n/10*100 : 6)}%"></span></div>
      <div class="hlist">
        ${(h.candidates||[]).map(c=>`<div class="hitem">
          <b>${esc(c.brand)} ${esc(c.model)}</b>
          <span>${esc(c.relation||'')}</span>
          <em>${c.status==='ok'?'✓ '+c.images.length+' 图':(c.status==='pending'?'…':'无图')}</em>
        </div>`).join('')}
      </div>
    </div>
    ${h.status==='fail'? `<div class="err">${esc(h.error||'检索失败')}
      <button class="link" id="retry">重试</button></div>` : ''}
    <div class="actions"><button class="btn ghost" id="back" ${h.status==='running'?'disabled':''}>上一步</button></div>
  </section>`;
  const rt = document.getElementById('retry');
  if(rt) rt.onclick = startHarvest;
  document.getElementById('back').onclick = ()=>{ state.step=1; render(); };
}

/* ---------------- 3 素材确认 ---------------- */
function initSelection(){
  state.excluded = new Set();
  (state.harvest.candidates||[]).forEach(c=>{
    if(!c.images || !c.images.length) state.excluded.add(c.brand+' '+c.model);
  });
}

function step3(){
  const list = state.harvest.candidates || [];
  const kept = list.filter(c=>!state.excluded.has(c.brand+' '+c.model));
  app.innerHTML = `<section class="step">
    <div class="phead2"><h2>素材确认</h2>
      <span class="hint">${kept.length} / ${list.length} 台参与 · 每台已现场抓图，点图片可换</span></div>
    <div class="grid">
      ${list.map(c=>{
        const id = c.brand+' '+c.model;
        const out = state.excluded.has(id);
        const img = (c.images||[])[0];
        return `<div class="vcard ${out?'out':''}" data-id="${esc(id)}">
          <button class="x" data-del="${esc(id)}" title="不参与">×</button>
          <div class="t">${esc(c.brand)} ${esc(c.model)}</div>
          <div class="m">${esc(c.relation||'')} · ${esc((c.reason||'').slice(0,22))}</div>
          ${img? `<img class="thumb" src="${esc(img.url)}" data-cycle="${esc(id)}"
                  onerror="this.classList.add('broken');this.alt='图源不可用'">`
               : `<div class="thumb empty">未取到图</div>`}
          <div class="evi">${esc((c.evidence||'').slice(0,34))}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="actions">
      <button class="btn ghost" id="back">上一步</button>
      <button class="btn" id="next" ${kept.length?'':'disabled'}>开始分析 · ${kept.length} 台</button>
    </div>
  </section>`;

  document.getElementById('back').onclick = ()=>{ state.step=2; render(); };
  document.getElementById('next').onclick = startRun;
  app.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const id = b.dataset.del;
      if(state.excluded.has(id)) state.excluded.delete(id); else state.excluded.add(id);
      render();
    };
  });
  app.querySelectorAll('[data-cycle]').forEach(im=>{
    im.onclick = ()=>{
      const id = im.dataset.cycle;
      const c = list.find(x=>x.brand+' '+x.model===id);
      if(c && c.images && c.images.length>1){ c.images.push(c.images.shift()); render(); }
    };
  });
}

/* ---------------- 4 分析 ---------------- */
async function startRun(){
  const vehicles = (state.harvest.candidates||[])
    .filter(c=>!state.excluded.has(c.brand+' '+c.model))
    .map(c=>({model_name: c.model, brand: c.brand, category: state.category,
              hero: (c.images&&c.images[0]) ? c.images[0].url : null}))
    .filter(v=>v.hero);
  const r = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({vehicles, parts: state.parts.filter(k=>k!=='front_face')})});
  const d = await r.json();
  state.runId = d.run_id; state.step = 4;
  localStorage.setItem('el_run', d.run_id);
  render(); poll();
}

function step4(){
  const job = state.job || {};
  if(job.status !== 'done'){
    const raw = job.progress || [];
    const byModel = new Map();
    raw.forEach(p=>{ if(p.model!=='-') byModel.set(p.model, p); });
    const prog = [...byModel.values()];
    const doneMsg = raw.filter(p=>p.model==='-').slice(-1)[0]?.msg || '';
    app.innerHTML = `<section class="step">
      <div class="phead2"><h2>分析</h2>
        <span class="hint">每台车一次调用，完成后逐台裁框</span></div>
      <div class="plist">
        ${prog.length?prog.map(p=>`<div class="prow">
          <i class="pdot ${p.state}"></i><span class="pname">${esc(p.model)}</span>
          <span class="pmsg">${esc(p.msg||'')}</span></div>`).join(''):
          `<div class="prow"><i class="pdot run"></i><span class="pname">准备中…</span></div>`}
      </div>
      ${doneMsg?`<p class="hint" style="margin-top:14px">${esc(doneMsg)}</p>`:''}
    </section>`;
    return;
  }
  const pages = state.job?.pages || [];
  if(!pages.length){ app.innerHTML = '<section class="step"><div class="phead2"><h2>分析</h2></div><p class="hint">没有可编辑的页面</p></section>'; return; }
  const i = Math.min(state.cropIdx||0, pages.length-1);
  const pg = pages[i];
  const src = `/files/${state.runId}/${pg.editor}?run_id=${state.runId}&slug=${encodeURIComponent(pg.model)}`;
  app.innerHTML = `<section class="step">
    <div class="phead2"><h2>逐台确认裁框</h2>
      <span class="hint">${i+1} / ${pages.length} · ${esc(pg.brand)} ${esc(pg.model)} · 拖框后点右侧「保存裁框」</span></div>
    <div class="frame" data-fit="off" style="aspect-ratio:auto;height:calc(100vh - 300px)">
      <iframe data-noscale="1" src="${src}" style="width:100%;height:100%;transform:none"></iframe>
    </div>
    <div class="actions">
      <button class="btn ghost" id="prev" ${i===0?'disabled':''}>上一台</button>
      <button class="btn" id="next">${i===pages.length-1?'完成 · 生成页面':'下一台'}</button>
    </div>
  </section>`;
  document.getElementById('prev').onclick = ()=>{ state.cropIdx=Math.max(0,i-1); render(); };
  document.getElementById('next').onclick = async ()=>{
    if(i < pages.length-1){ state.cropIdx=i+1; render(); return; }
    const btn = document.getElementById('next'); btn.disabled = true; btn.textContent='生成中…';
    const r = await fetch('/api/finalize/'+state.runId,{method:'POST'});
    state.built = (await r.json()).built || [];
    state.step = 5; render();
  };
}

async function poll(){
  const r = await fetch('/api/run/'+state.runId);
  state.job = await r.json();
  if(state.job.status !== 'done'){
    if(state.step===4) render();
    setTimeout(poll, 1200);
    return;
  }
  if(state.cropIdx === undefined) state.cropIdx = 0;
  render();
}

/* ---------------- 5 导出 ---------------- */
function step5(){
  const built = state.built || [];
  const i = Math.min(state.pageIdx||0, Math.max(0,built.length-1));
  const cur = built[i];
  app.innerHTML = `<section class="step">
    <div class="phead2"><h2>排版完成</h2>
      <span class="hint">${built.length? `${i+1} / ${built.length}` : '无页面'} · 页内可点右下角「编辑布局」微调</span></div>
    ${cur? `<div class="frame">
      <iframe src="/files/${state.runId}/${cur.file}" scrolling="no"></iframe>
    </div>` : '<p class="hint">没有生成页面</p>'}
    <div class="actions">
      <button class="btn ghost" id="prev" ${i<=0?'disabled':''}>上一页</button>
      <button class="btn ghost" id="nextp" ${i>=built.length-1?'disabled':''}>下一页</button>
      <button class="btn" id="exp" style="margin-left:auto">生成 PPTX</button>
      <span class="hint" id="msg"></span>
    </div>
  </section>`;
  document.getElementById('prev').onclick = ()=>{ state.pageIdx=Math.max(0,i-1); render(); };
  document.getElementById('nextp').onclick = ()=>{ state.pageIdx=Math.min(built.length-1,i+1); render(); };
  document.getElementById('exp').onclick = async ()=>{
    const msg = document.getElementById('msg');
    msg.textContent = '正在生成…';
    const r = await fetch('/api/export/'+state.runId,{method:'POST'});
    const d = await r.json();
    if(!r.ok){ msg.textContent = '失败：'+(d.detail||''); return; }
    msg.innerHTML = `<a class="btn ghost" href="${d.file}" download style="margin-left:8px">
      下载 ${esc(d.name)}</a>`;
  };
}

boot();
</script>
</body></html>
