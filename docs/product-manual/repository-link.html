<title>EquipLens-AI · GitHub Repository</title>
<style>
  :root{--paper:#F5F2EA;--ink:#141518;--muted:#74797C;--orange:#DF4A1B;--line:rgba(20,21,24,.18)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}

  p{font-size:16px;line-height:1.8;color:var(--muted);margin-top:16px}
  a{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:var(--ink);color:var(--paper);text-decoration:none;padding:14px 20px;font-size:14px;letter-spacing:.02em}
  a span{color:var(--orange);font-family:"Courier New",monospace}
  .url{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-family:"Courier New",monospace;font-size:11px;line-height:1.7;color:var(--muted);word-break:break-all}
